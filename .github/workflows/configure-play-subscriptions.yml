name: Configure Google Play subscriptions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-play-subscriptions.yml

permissions:
  contents: read

concurrency:
  group: gyosei-play-access
  cancel-in-progress: false

jobs:
  configure:
    if: github.repository == 'lifes20220721/gyoseishoshi-pass' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: play-store
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a853fdd9cc1a815588a8998c26c8b2b0dea7e98
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/configure-subscriptions.test.mjs
      - name: Create and verify monthly and yearly draft products
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/configure-subscriptions.mjs
