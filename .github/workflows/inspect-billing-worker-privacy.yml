          CERT
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in privacy-inspection/report.json -out privacy-inspection/report.enc inspection-certificate.pem
          python - <<'PY'
          from pathlib import Path
          Path('privacy-inspection/report.json').unlink()
          print('Only encrypted report is retained; decryption key is not in GitHub.')
