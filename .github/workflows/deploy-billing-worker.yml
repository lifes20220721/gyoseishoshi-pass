name: Deploy purchase verification Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gyosei-worker-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'lifes20220721/gyoseishoshi-pass' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: billing-backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d7ab2567a2c8d688fea76b2c058f27825c674d4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify purchase and deployment behavior
        run: |
          node worker.test.mjs
          node deploy-worker.test.mjs
      - name: Publish Worker and encrypted credential binding
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node deploy-worker.mjs
