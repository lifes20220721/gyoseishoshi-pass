name: Verify old xs968799 HTTP without writes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'lifes20220721/gyoseishoshi-pass' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1ccb7d74eb46abb028590fbcf401f3b8d53a02c
          persist-credentials: false
      - name: Verify every placed file by direct IP and check existing public services
        run: |
          python - <<'PY'
          from contextlib import closing
          import json,sys,secrets,re
          sys.path.insert(0,'hosting/xs968799')
          from deploy import OldServerHTTP
          for domain in ['gyoseishoshipass.com','shihoshoshipass.com']:
              for path in ['/icons/','/icons/blank.gif','/icons/icon-192.png?probe='+secrets.token_hex(8)]:
                  with closing(OldServerHTTP(domain,timeout=20)) as c:
                      c.request('GET',path,headers={'Cache-Control':'no-cache'})
                      r=c.getresponse();b=r.read(20000)
                      print('ICON_DIAGNOSIS',json.dumps({'domain':domain,'path':path,'status':r.status,'type':r.getheader('Content-Type'),'body_excerpt':b[:400].decode('utf-8',errors='replace') if 'text' in (r.getheader('Content-Type') or '') else None}),flush=True)
          PY
