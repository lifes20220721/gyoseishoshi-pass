name: Upload Google Play internal draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/upload-play-internal.yml

permissions:
  contents: read

concurrency:
  group: gyosei-play-access
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'lifes20220721/gyoseishoshi-pass' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: play-store
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/play-store/private/workflow-service-account.json
    steps:
      - name: Check out reviewed automation and encrypted bundle
        uses: actions/checkout@v4
        with:
          ref: c4c717344cadb4583922ab99c0f1dd5274f3fd60
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test encrypted transport and draft safety
        run: |
          node scripts/sealed-bundle.test.mjs
          node scripts/upload-internal.test.mjs
      - name: Decrypt signed AAB
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sealed-bundle.mjs open
      - name: Verify Android configuration and AAB signature
        run: node scripts/verify-play-store.mjs
      - name: Register internal testing draft
        run: node scripts/upload-internal.mjs --upload-draft
      - name: Record outcome
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Registered Gyoseishoshi PASS 1.1.0 (versionCode 2) as an internal testing draft. Tester distribution and production rollout were not started.\n');
          NODE
      - name: Remove temporary plaintext and credentials
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['private/workflow-service-account.json', 'app-release-bundle.aab']) fs.rmSync(file, { force: true });
          NODE
